name: APK Derle

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Neon Pinball APK
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK derle (release, imzalı)
        run: gradle -p android assembleRelease --no-daemon

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/NeonPinball.apk

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: NeonPinball-APK
          path: dist/NeonPinball.apk
          if-no-files-found: error

      - name: Release oluştur (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeonPinball.apk
          generate_release_notes: true
